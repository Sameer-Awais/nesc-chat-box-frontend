<div class="login-container">
  <form style="padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; justify-content: center; background: black; color: white;" (submit)="login()">
    <h2 style="text-align: center;">Login</h2>
      <label for="username">Username: </label>
      <input type="text" id="username" [(ngModel)]="username" name="username" class="form-control" required />

      <label for="password">Password: </label>
      <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required />

    <button type="submit" class="btn btn-secondary">Sign In</button>
  </form>

  <div *ngIf="userDetails" class="user-info">
    <h3>Logged in as:</h3>
    <p>Username: {{ userDetails.username }}</p>
    <p>Email: {{ userDetails.email }}</p>
    <p>Name: {{ userDetails.first_name }} {{ userDetails.last_name }}</p>
  </div>
</div>
